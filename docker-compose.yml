version: "3.9"

services:
  # ── Application ────────────────────────────────
  app:
    build:
      context: .
      target: runtime          # use the slim runtime stage
    image: flask-cicd-demo:local
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      APP_VERSION: "local"
      PORT: 5000
    volumes:
      - ./app:/home/appuser/app/app   # live-reload during dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend

  # ── Optional: Nginx reverse proxy ──────────────
  # Uncomment to simulate a real production setup
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: nginx_proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - backend

networks:
  backend:
    driver: bridge
